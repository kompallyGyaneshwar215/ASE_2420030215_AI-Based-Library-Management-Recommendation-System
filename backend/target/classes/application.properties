spring.application.name=ai-library-backend
server.port=8080

# Active Profile (change to 'mysql' when running with local MySQL database)
# Default is 'h2' for seamless zero-setup execution, or switch to 'mysql'
spring.profiles.active=h2

# Library Business Rules Configuration
library.loan.duration-days=14
library.loan.fine-per-day=5.0
library.loan.max-borrow-limit=3

# AI Recommendation Service endpoint
ai.recommendation.service.url=http://localhost:8000

# JWT Configuration
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-milliseconds=86400000

# File Upload limit
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
